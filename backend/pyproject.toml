[project]
name = "ai-video-platform"
version = "0.1.0"
description = "AI Video Automation System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "mangum>=0.17.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "crewai>=0.1.0",
    "anthropic>=0.18.0",
    "httpx>=0.26.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.6",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "moto[dynamodb,s3,secretsmanager]>=5.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "boto3-stubs[dynamodb,s3,secretsmanager,stepfunctions]>=1.34.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true