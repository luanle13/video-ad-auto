name: 'Setup Python'
description: 'Composite action to setup Python with caching and dependency installation'

inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.11'
  cache:
    description: 'Enable pip cache'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for dependency installation'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: '${{ inputs.working-directory }}/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ inputs.working-directory }}/requirements.txt
      shell: bash
      working-directory: ${{ inputs.working-directory }}