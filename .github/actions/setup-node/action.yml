name: 'Setup Node.js'
description: 'Composite action to setup Node.js with caching and dependency installation'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: true
    default: '20'
  cache:
    description: 'Enable npm cache'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for dependency installation'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'

    - name: Install dependencies
      run: |
        npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}